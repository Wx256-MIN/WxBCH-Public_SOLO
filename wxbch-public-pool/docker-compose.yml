version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: $GATEWAY_IP
      APP_PORT: 41839
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/wx256-min/wxbch-public-pool:1.0.4
    restart: on-failure
    stop_grace_period: 30s
    network_mode: host
    volumes:
      - "${APP_DATA_DIR}/data:/data"
    environment:
      NODE_ENV: production
      BCHN_RPC_URL: "http://127.0.0.1:${APP_BITCOIN_RPC_PORT:-8332}"
      BCHN_RPC_USER: "${APP_BITCOIN_RPC_USER:-}"
      BCHN_RPC_PASSWORD: "${APP_BITCOIN_RPC_PASS:-}"
      BCHN_RPC_PORT: "${APP_BITCOIN_RPC_PORT:-8332}"
      BCHN_ZMQ_HOST: "tcp://127.0.0.1:28332"
      STRATUM_PORT: "41837"
      API_PORT: "41839"
      NETWORK: "mainnet"
      POOL_IDENTIFIER: "WxBCH Public Pool"
      DB_PATH: "/data/pool.sqlite"
