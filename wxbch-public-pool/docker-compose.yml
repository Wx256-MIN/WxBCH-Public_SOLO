version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: wxbch-public-pool_web_1
      APP_PORT: 8080

  web:
    image: ghcr.io/wx256-min/wxbch-public-pool:1.0.6
    restart: on-failure
    init: true
    stop_grace_period: 30s
    ports:
      - "41837:41837/tcp"
    volumes:
      - "${APP_DATA_DIR}/data:/data"
    environment:
      NODE_ENV: production
      BCHN_RPC_URL: "http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}"
      BCHN_RPC_USER: "${APP_BITCOIN_RPC_USER}"
      BCHN_RPC_PASSWORD: "${APP_BITCOIN_RPC_PASS}"
      BCHN_RPC_PORT: "${APP_BITCOIN_RPC_PORT}"
      BCHN_ZMQ_HOST: "tcp://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_ZMQ_HASHBLOCK_PORT}"
      STRATUM_PORT: "41837"
      API_PORT: "8080"
      NETWORK: "mainnet"
      POOL_IDENTIFIER: "WxBCH Public Pool"
      DB_PATH: "/data/pool.sqlite"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/pool').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
