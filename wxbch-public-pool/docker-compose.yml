version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: wxbch-public-pool_web_1
      APP_PORT: 41838
      PROXY_AUTH_ADD: "false"

  web:
    image: ghcr.io/wx256-min/wxbch-public-pool:1.0.5
    restart: on-failure
    stop_grace_period: 30s
    ports:
      - "41837:41837/tcp"
    volumes:
      - "${APP_DATA_DIR}/data:/data"
    environment:
      NODE_ENV: production
      BCHN_RPC_URL: "http://${APP_BITCOIN_NODE_IP}:${APP_BITCOIN_RPC_PORT}"
      BCHN_RPC_USER: "${APP_BITCOIN_RPC_USER}"
      BCHN_RPC_PASSWORD: "${APP_BITCOIN_RPC_PASS}"
      BCHN_RPC_PORT: "${APP_BITCOIN_RPC_PORT}"
      BCHN_ZMQ_HOST: "${BCHN_ZMQ_HOST:-}"
      STRATUM_PORT: "41837"
      API_PORT: "41838"
      NETWORK: "mainnet"
      POOL_IDENTIFIER: "WxBCH Public Pool"
      DB_PATH: "/data/pool.sqlite"
