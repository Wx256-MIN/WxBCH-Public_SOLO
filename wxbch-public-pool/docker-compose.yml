version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: wxbch-public-pool_web_1
      APP_PORT: 41838
      PROXY_AUTH_WHITELIST: "/api/*"

  web:
    image: ghcr.io/wx256-min/wxbch-public-pool:1.0.11
    restart: on-failure
    init: true
    stop_grace_period: 30s
    ports:
      - "41837:41837/tcp"
    expose:
      - "41838"
    volumes:
      - "${APP_DATA_DIR}/data/pool:/data"
    environment:
      NODE_ENV: production

      # Connect to the BCHN app supplied by the LoneStrike/SSLabs BCH store.
      # Do not start a second BCHN container here.
      BCHN_RPC_URL: "http://sslabs-bitcoin-cash-node_bitcoind_1:8332"
      BCHN_RPC_HOST: "sslabs-bitcoin-cash-node_bitcoind_1"
      BCHN_RPC_PORT: "8332"
      BCHN_RPC_USER: "bchn"
      BCHN_RPC_PASSWORD: "bchn_local_rpc_pw_2f9c"
      BCHN_ZMQ_HOST: "tcp://sslabs-bitcoin-cash-node_bitcoind_1:28332"

      STRATUM_PORT: "41837"
      API_PORT: "41838"
      NETWORK: "mainnet"
      POOL_IDENTIFIER: "WxBCH Public Pool"
      DB_PATH: "/data/pool.sqlite"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:41838/api/pool').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
