services:
  wxbch-public-pool:
    build: .
    container_name: wxbch-public-pool
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "41837:41837/tcp"
      - "41838:41838/tcp"
    volumes:
      - pool-data:/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:41838/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  pool-data:
