services:
  wxbch-public-pool:
    build: .
    container_name: wxbch-public-pool
    restart: unless-stopped
    init: true
    ports:
      - "3333:3333/tcp"
      - "3334:3334/tcp"
    volumes:
      - ./data:/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      BCHN_RPC_URL: ${BCHN_RPC_URL:-http://host.docker.internal:8332}
      BCHN_RPC_USER: ${BCHN_RPC_USER:-}
      BCHN_RPC_PASSWORD: ${BCHN_RPC_PASSWORD:-}
      BCHN_RPC_PORT: ${BCHN_RPC_PORT:-8332}
      BCHN_ZMQ_HOST: ${BCHN_ZMQ_HOST:-tcp://host.docker.internal:28332}
      STRATUM_PORT: ${STRATUM_PORT:-3333}
      API_PORT: ${API_PORT:-3334}
      NETWORK: ${NETWORK:-mainnet}
      POOL_IDENTIFIER: ${POOL_IDENTIFIER:-WxBCH-Public-Pool}
      DB_PATH: /data/pool.sqlite