name: Build and publish WxBCH images

on:
  push:
    branches: ["main"]
    paths:
      - "wxbch-public-solo/node/**"
      - "wxbch-public-solo/ckpool/**"
      - "wxbch-public-solo/web/**"
      - ".github/workflows/build-images.yml"
      - "wxbch-public-solo/umbrel-app.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: bchn
            context: wxbch-public-solo/node
            dockerfile: wxbch-public-solo/node/Dockerfile
          - name: ckpool
            context: wxbch-public-solo/ckpool
            dockerfile: wxbch-public-solo/ckpool/Dockerfile
          - name: web
            context: wxbch-public-solo/web
            dockerfile: wxbch-public-solo/web/Dockerfile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read app version
        id: version
        shell: bash
        run: VERSION=$(grep '^version:' wxbch-public-solo/umbrel-app.yml | cut -d '"' -f2) && echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build and push multi-architecture image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/wx256-min/wxbch-${{ matrix.name }}:${{ steps.version.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/Wx256-MIN/WxBCH-Public_SOLO
            org.opencontainers.image.revision=${{ github.sha }}
