manifestVersion: 1
id: bch-solo-pool
category: finance
name: BCH Solo Pool
version: "1.6.0"
tagline: Self-hosted Bitcoin Cash solo mining pool

releaseNotes: >-
  Fixes the Umbrel BCHN connection path by using the official Bitcoin Cash Node exported RPC and ZMQ IP/port variables instead of the pool container's local bitcoind hostname. Makes saved dashboard RPC/ZMQ settings persist across restarts. Adds automatic RPC/template recovery when BCHN is still starting or temporarily unavailable, plus a 60-second fallback that detects missed ZMQ block notifications without creating unnecessary jobs. Keeps the ZMQ subscriber resilient across disconnects. Adds Stratum ping compatibility and correct multi-session worker connection tracking. Hides the Recent Activity dashboard panel and removes its obsolete frontend update code. Adds CI unit tests and Python compile checks before Docker publishing.
description: >-
  Self-hosted Bitcoin Cash solo mining pool for the Umbrel BCHN node and SHA-256 ASIC miners.
  Provides Stratum V1, BCHN block-template integration, optional ZMQ block
  notifications, share accounting, block-candidate submission, setup and dashboard.

