manifestVersion: 1
id: bch-solo-pool
category: finance
name: BCH Solo Pool
version: "1.1.2"
tagline: Self-hosted Bitcoin Cash solo mining pool

releaseNotes: >-
  Fixes Umbrel runtime permissions for the persistent data directory, adds a
  container healthcheck, and moves the Umbrel web proxy to a dedicated host port
  to avoid common port-8080 conflicts.

description: >-
  Self-hosted Bitcoin Cash solo mining pool for BCHN/AxeBCH and SHA-256 ASIC miners.
  Provides Stratum V1, BCHN block-template integration, optional ZMQ block
  notifications, share accounting, block-candidate submission, setup and dashboard.

