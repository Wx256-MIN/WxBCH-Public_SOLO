manifestVersion: 1
id: bch-solo-pool
category: finance
name: BCH Solo Pool
version: "1.1.6"
tagline: Self-hosted Bitcoin Cash solo mining pool

releaseNotes: >-
  Connects directly to the Umbrel Bitcoin Cash Node (BCHN) app using its exported
  RPC and ZMQ connection details. Also fixes the setup form repeatedly moving
  focus back to the first field while editing.

description: >-
  Self-hosted Bitcoin Cash solo mining pool for the Umbrel BCHN node and SHA-256 ASIC miners.
  Provides Stratum V1, BCHN block-template integration, optional ZMQ block
  notifications, share accounting, block-candidate submission, setup and dashboard.

developer: BCH Solo Pool Community
website: https://github.com/Wx256-MIN/WxBCH-SOLO
