manifestVersion: 1
id: bch-solo-pool
category: finance
name: BCH Solo Pool
version: "1.6.2"
tagline: Self-hosted Bitcoin Cash solo mining pool

releaseNotes: >-
  Expands Stratum V1 compatibility for BIP310 version rolling, minimum-difficulty, subscribe-extranonce, target suggestions, transaction requests, ping, and capabilities. Corrects BIP310 version-field reconstruction so protected version bits are preserved. Keeps high-difficulty miners connected even when they have not found a share yet. Improves dead-session cleanup during job broadcasts and adds regression tests for the new protocol behavior.
description: >-
  Self-hosted Bitcoin Cash solo mining pool for the Umbrel BCHN node and SHA-256 ASIC miners.
  Provides Stratum V1, BCHN block-template integration, optional ZMQ block
  notifications, share accounting, block-candidate submission, setup and dashboard.

developer: BCH Solo Pool Community
website: https://github.com/Wx256-MIN/WxBCH-SOLO
