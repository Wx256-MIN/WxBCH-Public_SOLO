manifestVersion: 1
id: bch-solo-pool
category: finance
name: BCH Solo Pool
version: "1.7.1"
tagline: Self-hosted Bitcoin Cash solo mining pool

releaseNotes: >-
  Stability release: hardens Stratum sessions, smooths Vardiff, retains valid same-tip jobs, uses correct clean-job semantics, improves stale-share tolerance, and strengthens BCHN/ZMQ recovery, graceful shutdown, durable configuration, SQLite durability, readiness checks, and container lifecycle handling.
description: >-
  Self-hosted Bitcoin Cash solo mining pool for the Umbrel BCHN node and SHA-256 ASIC miners.
  Provides Stratum V1, BCHN block-template integration, optional ZMQ block
  notifications, share accounting, block-candidate submission, setup and dashboard.

