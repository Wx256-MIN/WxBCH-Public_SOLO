version: "3.7"

services:
  app_proxy:
    environment:
      APP_HOST: bch-solo-pool_server_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "true"

  server:
    image: ghcr.io/wx256-min/bch-solo-pool:latest
    restart: unless-stopped
    stop_grace_period: 1m
    init: true
    ports:
      - "3334:3334"
    volumes:
      - ${APP_DATA_DIR}/data:/data
    environment:
      POOL_ID: "BCH Solo Pool"
      STRATUM_HOST: "0.0.0.0"
      STRATUM_PORT: "3334"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8080"
      START_DIFFICULTY: "1"
      VARDIFF_ENABLED: "true"
      VARDIFF_TARGET_SECONDS: "30"
      VARDIFF_MIN: "0.001"
      VARDIFF_MAX: "1000000000"
      COINBASE_MESSAGE: "BCH Solo Pool"
      DB_PATH: "/data/pool.sqlite3"
      CONFIG_PATH: "/data/config.json"
      LOG_LEVEL: "INFO"
    extra_hosts:
      - "host.docker.internal:host-gateway"
