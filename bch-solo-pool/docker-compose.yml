version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: bch-solo-pool_server_1
      APP_PORT: 8080
      PROXY_AUTH_ADD: "true"
  server:
    build: .
    image: ghcr.io/wx256-min/bch-solo-pool:latest
    user: "1000:1000"
    restart: unless-stopped
    stop_grace_period: 30s
    init: true
    security_opt:
      - no-new-privileges:true
    ports:
      - "0.0.0.0:3334:3334/tcp"
    environment:
      BCH_RPC_URL: "http://${APP_BITCOIN_CASH_NODE_NODE_IP}:${APP_BITCOIN_CASH_NODE_RPC_PORT}/"
      BCH_RPC_USER: "${APP_BITCOIN_CASH_NODE_RPC_USER}"
      BCH_RPC_PASSWORD: "${APP_BITCOIN_CASH_NODE_RPC_PASS}"
      BCH_PAYOUT_ADDRESS: "${BCH_PAYOUT_ADDRESS}"
      STRATUM_HOST: "0.0.0.0"
      STRATUM_PORT: "3334"
      WEB_HOST: "0.0.0.0"
      WEB_PORT: "8080"
      START_DIFFICULTY: "1000"
      VARDIFF_MIN: "1"
      VARDIFF_MAX: "65536"
      COINBASE_MESSAGE: "BCH Solo Pool"
    extra_hosts:
      - "host.docker.internal:host-gateway"
