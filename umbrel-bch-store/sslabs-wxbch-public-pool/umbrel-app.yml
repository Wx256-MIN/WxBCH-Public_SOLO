manifestVersion: 1
id: sslabs-wxbch-public-pool
category: bitcoin
name: WxBCH Public Pool
version: "1.0.11"
icon: https://raw.githubusercontent.com/Wx256-MIN/WxBCH-Public_SOLO/umbrel-bch-store-integration/umbrel-bch-store/sslabs-wxbch-public-pool/icon.svg
tagline: BCHN-native Stratum V1 solo mining pool
description: >-
  WxBCH Public Pool is a Bitcoin Cash solo mining pool based on the Public-Pool
  architecture and built specifically for Bitcoin Cash Node (BCHN). It provides
  Stratum V1 for SHA-256 ASIC miners, variable difficulty, ASICBoost/version
  rolling, worker statistics, rejected-share tracking, block detection, and a
  web dashboard.

  The pool uses the Bitcoin Cash Node app already provided by this community
  store. No second BCHN node is installed. RPC and ZMQ stay on the private
  Umbrel app network.

  Install and sync the Bitcoin Cash Node app first. Then point your BCH ASIC
  miners to the WxBCH Stratum endpoint on port 41837.
