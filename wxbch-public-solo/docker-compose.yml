version: "3.7"
services:
  app_proxy:
    environment:
      APP_HOST: wxbch-public-solo_web_1
      APP_PORT: 8080
  bchn:
    build:
      context: ./node
      args:
        BCHN_VERSION: "29.2.0"
    restart: unless-stopped
    stop_grace_period: 2m
    volumes:
      - ${APP_DATA_DIR}/bitcoin:/root/.bitcoin
      - rpc_config:/run/wxbch
    ports:
      - "8333:8333"
    expose: ["8332","28332"]
    healthcheck:
      test: ["CMD-SHELL","bitcoin-cli -datadir=/root/.bitcoin getblockchaininfo >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 30s
  ckpool:
    build:
      context: ./ckpool
    restart: unless-stopped
    depends_on:
      bchn:
        condition: service_healthy
    volumes:
      - rpc_config:/run/wxbch:ro
      - ckpool_data:/var/lib/ckpool
      - ckpool_run:/run/ckpool
    ports: ["3333:3333"]
    environment:
      BCH_RPC_HOST: bchn
      BCH_RPC_PORT: "8332"
      BCH_ZMQ_URL: tcp://bchn:28332
      STRATUM_PORT: "3333"
      POOL_FEE: "0"
      POOL_NAME: "WxBCH Public SOLO"
  web:
    build:
      context: ./web
    restart: unless-stopped
    depends_on:
      bchn:
        condition: service_started
      ckpool:
        condition: service_started
    volumes:
      - rpc_config:/run/wxbch:ro
      - ckpool_run:/run/ckpool:ro
      - ckpool_data:/var/lib/ckpool:ro
    environment:
      BCH_RPC_HOST: bchn
      BCH_RPC_PORT: "8332"
      CKPOOL_SOCKET_PARENT: /run
      CKPOOL_SOCKET_NAME: ckpool
      CKPOOL_SOCKET_PROCESS: stratifier
      APP_VERSION: "0.1.0"
    expose: ["8080"]
volumes:
  rpc_config:
  ckpool_run:
  ckpool_data:
